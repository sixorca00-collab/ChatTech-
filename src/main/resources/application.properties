# -----------------------------------------------------------------------------
# CONFIGURACIÓN DE MONGODB
# -----------------------------------------------------------------------------
# Si usas una base de datos local (asegúrate de tener MongoDb Compass o el servicio activo)
spring.data.mongodb.uri=mongodb://localhost:27017/chattech

# O si te pasan una cadena de conexión en la nube (MongoDB Atlas), se vería así:
# spring.data.mongodb.uri=mongodb+srv://usuario:password@cluster.mongodb.net/chattech

# -----------------------------------------------------------------------------
# CONFIGURACIÓN DE SPRING AI & OPENAI
# -----------------------------------------------------------------------------
# Tu clave secreta de la API de OpenAI (La que estás esperando)
spring.ai.openai.api-key=TU_API_KEY_AQUI

# CORRECCIÓN: Estructura de propiedades oficial para Spring AI
spring.ai.openai.chat.completions.model=gpt-3.5-turbo
spring.ai.openai.chat.completions.temperature=0.7